<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Should I Wear Shorts Today?</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Should I Wear Shorts Today?" />
    <meta property="og:description" content="Check if it's warm enough to wear shorts in your county in Ireland." />
    <meta property="og:image" content="./assets/yes_shorts.png" />
    <meta property="og:url" content="" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Should I wear shorts today?</h1>
      <p class="subtitle">Choose your county and check the live temperature.</p>

      <section class="card" aria-live="polite">
        <div class="controls">
          <label for="countySelect">County</label>
          <select id="countySelect"></select>
          <button id="refreshBtn" type="button">Refresh</button>
        </div>

        <div class="verdict-header">
          <p id="status">Checking the weather...</p>
          <button
            id="infoBtn"
            type="button"
            class="info-btn"
            aria-label="How was this verdict reached?"
            aria-expanded="false"
            aria-controls="infoTooltip"
            hidden
          >ℹ</button>
        </div>
        <div id="infoTooltip" class="info-tooltip" hidden>
          <p id="infoTooltipText"></p>
        </div>
        <div id="verdictArt" class="verdict-art" aria-hidden="true"></div>
        <p id="temperature" class="temperature"></p>
        <p id="details" class="details"></p>
        <p id="lastUpdated" class="last-updated"></p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
